name: Build Quenya Traductor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Descomprimir cualquier ZIP en el repositorio
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Descomprimiendo: $f"
              unzip -o "$f"
            fi
          done

      - name: Mostrar estructura de archivos descompuesta
        run: |
          echo "=== Lista de archivos encontrados ==="
          find . -maxdepth 3

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos y compilar
        run: |
          GRADLE_EXEC=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_EXEC" ]; then
            echo "ERROR: No se encontró el archivo 'gradlew'. Asegúrate de que el ZIP contenga el proyecto de Android completo."
            exit 1
          fi
          DIR=$(dirname "$GRADLE_EXEC")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
