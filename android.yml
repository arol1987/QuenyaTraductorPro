name: Build Quenya Traductor APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Listar archivos para inspección
        run: |
          echo "=== Archivos en el repositorio ==="
          ls -la

      - name: Extraer ZIP si existe
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Intentando extraer: $ZIP"
            unzip -q "$ZIP" || true
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK con Gradle
        run: |
          GRADLEW=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW" ]; then
            DIR=$(dirname "$GRADLEW")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: No se encontró el archivo gradlew en el proyecto."
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
