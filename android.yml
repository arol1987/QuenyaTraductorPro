name: Build Quenya Traductor APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Descomprimir proyecto si existe
        run: |
          if ls *quenya*.zip 1> /dev/null 2>&1; then
            unzip -o *quenya*.zip -d .
          elif ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d .
          else
            echo "No se encontró archivo ZIP, continuando con los archivos del repositorio."
          fi

      - name: Buscar y organizar estructura de Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            if [ "$DIR" != "." ]; then
              echo "Moviendo archivos desde $DIR a la raíz..."
              cp -r "$DIR"/* . 2>/dev/null || true
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: No se encontró el archivo gradlew en la raíz."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
