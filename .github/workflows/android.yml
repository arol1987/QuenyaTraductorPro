name: Build Quenya Traductor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extraer proyecto ZIP si existe
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos y compilar
        run: |
          GRADLE_EXEC=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_EXEC" ]; then
            echo "Error: No se encontró el archivo gradlew en el repositorio."
            exit 1
          fi
          DIR=$(dirname "$GRADLE_EXEC")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
